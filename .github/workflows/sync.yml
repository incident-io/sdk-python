name: sync

# Runs hourly once enabled. When the schema hasn't changed the job exits in
# seconds, which is what makes that affordable.
#
# Do not rename this file. PyPI's trusted-publishing binding is registered
# against the repo and this filename, so a rename breaks publishing silently.
on:
  # Disabled until PyPI trusted publishing is set up: without it the first
  # schema change would tag and release, then fail at the publish step.
  # Uncomment to start the hourly loop. Avoid minute 0, which is GitHub's most
  # contended scheduling slot.
  # schedule:
  #   - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [minor, major]
        default: minor
      acknowledge_breaking:
        description: "Publish even though oasdiff reports a breaking change"
        type: boolean
        default: false
      dry_run:
        description: "Regenerate and build, but don't tag, release or publish"
        type: boolean
        default: false

permissions:
  contents: write # commit + tag + create release
  issues: write # open an issue when a breaking change is detected
  id-token: write # PyPI trusted publishing (job-scoped, hence one job)

concurrency:
  group: sync
  cancel-in-progress: false

env:
  # Pinned deliberately: oasdiff decides whether we publish at all.
  OASDIFF_VERSION: "1.32.1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need full history + tags to read the last version

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Goes to a scratch path because oasdiff needs both versions to compare;
      # writing straight over openapi.json would lose the old one.
      - name: Fetch latest public schema
        # -L because without it a redirect succeeds and writes zero bytes,
        # which oasdiff reads as an empty schema and reports as every endpoint
        # having been removed.
        run: curl -sfSL https://api.incident.io/v1/openapiV3.json -o openapi.json.new

      - name: Exit early if schema unchanged
        id: changed
        run: |
          if diff -q openapi.json openapi.json.new >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for breaking changes
        if: steps.changed.outputs.changed == 'true'
        id: breaking
        run: |
          set -euo pipefail
          curl -sfSL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp oasdiff

          # First release: nothing to compare against.
          if [ ! -f openapi.json ]; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # oasdiff-severity.txt downgrades two rules from ERR. oasdiff judges
          # the schema; what we ship is a client generated from it, and an
          # added response enum value is breaking only for someone pinned to an
          # older client — which is what the version bump is for. Left at ERR
          # they halt about a quarter of real schema changes: over 49
          # consecutive changes from sdk-go's history, 12 would have stopped,
          # 11 of them for an added enum value. The file takes no comments.
          report="$(/tmp/oasdiff breaking openapi.json openapi.json.new \
            --severity-levels oasdiff-severity.txt --fail-on ERR 2>&1)" && rc=0 || rc=$?
          echo "$report"

          # 1 means it found breaking changes. Anything else means it couldn't
          # do the comparison at all — a truncated fetch, an HTML error page —
          # which is not a breaking change and mustn't be filed as one.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::oasdiff exited $rc without comparing the schemas."
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            { echo "report<<OASDIFF_EOF"; echo "$report"; echo "OASDIFF_EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      # A human dispatch with acknowledge_breaking skips this, and that is the
      # only way to ship a major — nothing can publish outside this workflow.
      - name: Halt on breaking change
        if: steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking == 'true' && !inputs.acknowledge_breaking
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.breaking.outputs.report }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          The upstream OpenAPI schema changed in a way that is **not backwards-compatible**, so the automated release was halted rather than publishing a breaking change as a minor bump.

          A human needs to decide how to proceed — most likely a new major version.

          <details><summary>oasdiff report</summary>

          \`\`\`
          $REPORT
          \`\`\`

          </details>

          Triggered by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          )"
          # We stop without committing the new schema, so every later run sees
          # the same diff and lands here again. Only file one issue.
          existing="$(gh issue list --label breaking-change --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "::error::Breaking change detected; issue #$existing is already open."
            exit 1
          fi

          # Created here rather than assumed: gh issue create fails outright on
          # a label that doesn't exist, and an unlabelled fallback would be
          # invisible to the dedup above, filing one issue an hour forever.
          gh label create breaking-change \
            --description "Schema changed incompatibly; release halted" \
            --color B60205 2>/dev/null || true

          gh issue create \
            --title "Breaking API change detected — manual release required" \
            --body "$body" \
            --label "breaking-change"
          echo "::error::Breaking change detected; opened an issue and stopped."
          exit 1

      # Scheduled runs only ever bump minor, since anything breaking has already
      # stopped the run. Patch is for hand-fixes, major for a human dispatch.
      - name: Decide next version
        if: steps.changed.outputs.changed == 'true'
        id: version
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump || 'minor' }}"
          # Highest version, not `git describe`'s nearest-by-commit-distance:
          # a hand-cut patch tag would otherwise make us recompute a version
          # that already exists. The pattern also skips any non-semver tag,
          # which awk would silently turn into v1.0.0.
          BASE="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"

          if [ -z "$BASE" ]; then
            NEXT="v1.0.0"
          elif [ "$BUMP" = "major" ]; then
            NEXT="$(echo "${BASE#v}" | awk -F. '{printf "v%d.0.0", $1+1}')"
          else
            NEXT="$(echo "${BASE#v}" | awk -F. '{printf "v%d.%d.0", $1, $2+1}')"
          fi

          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null; then
            echo "::error::$NEXT already exists. A previous run tagged without"
            echo "::error::publishing, or a tag was cut by hand. Resolve before releasing."
            exit 1
          fi

          echo "Next version: $NEXT (base: ${BASE:-none}, bump: $BUMP)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # Before make verify, so the wheel we check is the wheel we publish.
      - name: Set the release version
        if: steps.changed.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = /s/^version = .*/version = \"${NEXT#v}\"/" pyproject.toml
          grep -m1 '^version = ' pyproject.toml

      - name: Regenerate and verify
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mv openapi.json.new openapi.json
          make generate
          make verify
          # The generated code changes on every release, which is exactly when
          # behaviour needs checking. make verify only proves it imports.
          uv run --group dev pytest tests/ -q

      # make verify fails when something left the public surface. That is a
      # breaking change oasdiff cannot see, so it gets oasdiff's treatment:
      # an issue, and no publish.
      - name: Report a breaking change to the generated API
        if: failure() && steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --quiet -- api-surface.txt && exit 0 || true

          gh label create breaking-change \
            --description "Schema changed incompatibly; release halted" \
            --color B60205 2>/dev/null || true

          if gh issue list --label breaking-change --state open --limit 1 \
              --json number --jq '.[0].number // empty' | grep -q .; then
            echo "::error::Already reported."
            exit 1
          fi

          gh issue create --title "Generated API changed incompatibly — manual release required" \
            --label breaking-change --body "$(cat <<EOF
          Something left the SDK's public surface. The wire contract may be unchanged — oasdiff passed — but consumers import these names, so this breaks them at import or call time.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Release with \`bump: major\` once you have decided, then run \`make surface\` to accept the new baseline.
          EOF
          )"
          exit 1

      # Every step above this point fails without committing anything, so the
      # next run sees the same schema diff and fails identically. Left alone
      # that is a red cron every hour and no other signal.
      - name: Report a stuck release
        if: failure() && steps.changed.outputs.changed == 'true' && steps.breaking.outputs.breaking != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Release is stuck — regeneration or verification is failing"
          gh label create release-stuck \
            --description "The hourly sync cannot complete and will retry forever" \
            --color B60205 2>/dev/null || true

          if gh issue list --label release-stuck --state open --limit 1 \
              --json number --jq '.[0].number // empty' | grep -q .; then
            echo "Already reported."
            exit 0
          fi

          gh issue create --title "$title" --label release-stuck --body "$(cat <<EOF
          The hourly sync failed after detecting a schema change, before committing anything. The next run will see the same diff and fail the same way, so this repeats hourly until someone looks.

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Likely causes: the generator rejected the new schema, a post-generation fix in \`scripts/\` stopped matching, or verification failed.
          EOF
          )"

      - name: Report what a dry run would have done
        if: steps.changed.outputs.changed == 'true' && inputs.dry_run
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          {
            echo "### Dry run — nothing was tagged or published"
            echo
            echo "Would have released **$NEXT**."
            echo
            echo "Built artefacts:"
            echo '```'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and release
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "incident-io-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openapi.json pyproject.toml incident_io api-surface.txt
          git commit -m "Update to schema as of $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Regenerated from https://api.incident.io/v1/openapiV3.json"
          git tag "$NEXT"
          # --atomic: otherwise the tag can land while the branch push is
          # refused, and every later run recomputes this version and dies on
          # "tag already exists".
          git push --atomic origin HEAD "refs/tags/$NEXT"
          gh release create "$NEXT" --generate-notes --title "$NEXT"

      # Has to live in this job: id-token is job-scoped, and a tag pushed with
      # GITHUB_TOKEN won't trigger a separate workflow.
      - name: Publish to PyPI
        if: steps.changed.outputs.changed == 'true' && !inputs.dry_run
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
