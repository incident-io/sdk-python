name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # Builds the wheel, installs it, byte-compiles the tree and imports every
      # module. See scripts/verify_import.py.
      - run: make verify
      # Behavioural checks against a stub transport, so they need no API key.
      # scripts/smoke_test.py covers the live API and is run by hand.
      - run: uv run --group dev pytest tests/ -q

  # Fail if the committed client is out of date with the committed schema — i.e.
  # someone changed openapi.json without re-running the generator. Regenerates
  # from the committed schema, not the live one, so this stays a check on the
  # commit rather than a second copy of the sync job.
  generate-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      # The generator's post_hooks shell out to ruff. Without it on PATH they
      # are skipped with a warning, and --fail-on-warning then fails the build.
      # uv installs tools into ~/.local/bin, which isn't on a runner's PATH.
      - run: |
          uv tool install ruff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make generate
      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated client is out of date. Run 'make generate' and commit the result."
            git diff --stat
            exit 1
          fi
