[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incident-io"
# The release workflow sets this before building, so it tracks whatever we
# last published.
version = "0.0.0"
description = "Python SDK for the incident.io API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "incident.io", email = "support@incident.io" }]
keywords = ["incident.io", "incident", "on-call", "alerting", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.23.1,<0.29.0",
  "attrs>=22.2.0",
]

[project.urls]
Documentation = "https://api-docs.incident.io/"
Source = "https://github.com/incident-io/sdk-python"
Changelog = "https://github.com/incident-io/sdk-python/releases"

[tool.hatch.build.targets.wheel]
packages = ["incident_io"]

[tool.hatch.build.targets.sdist]
include = ["incident_io", "openapi.json", "LICENSE", "README.md"]
